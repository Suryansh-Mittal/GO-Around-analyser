[project]
name = "goaround"
version = "0.1.0"
description = "Aborted-landing (go-around) risk prediction from open ADS-B data"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Suryansh Mittal" }]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
