# mamba env create -f environment.yml   (or: conda env create -f environment.yml)
# conda activate goaround
name: goaround
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - traffic
  - onnxruntime=*=*cpu*   # traffic needs onnxruntime; CPU build avoids a huge CUDA download
  - pyopensky
  - polars
  - pyarrow
  - pandas
  - scikit-learn
  - lightgbm
  - shap
  - matplotlib
  - jupyterlab
  - requests
  - python-dotenv
  - jsonschema
  - pytest
  - ruff
